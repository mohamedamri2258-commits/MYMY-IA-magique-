<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYMY-IA Magique - Intelligent AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">✨</span>
                    <span class="logo-text">MYMY-IA</span>
                </div>
            </div>
            
            <div class="sidebar-actions">
                <button id="new-chat-btn" class="btn btn-primary btn-block">
                    <span>+ Nouvelle conversation</span>
                </button>
            </div>
            
            <div class="conversations-list">
                <div id="conversations-container"></div>
            </div>
            
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-secondary btn-block">
                    Déconnexion
                </button>
            </div>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="main-content">
            <div id="chat-container" class="chat-container">
                <!-- Messages will be inserted here -->
            </div>
            
            <div class="chat-input-area">
                <form id="chat-form" class="chat-form">
                    <div class="input-wrapper">
                        <textarea 
                            id="message-input" 
                            class="message-input" 
                            placeholder="Posez votre question à MYMY-IA Magique..."
                            rows="1"
                        ></textarea>
                        <button type="submit" class="btn-send">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2 10L18 2L10 18L8 11L2 10Z" fill="currentColor"/>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <div class="auth-container">
                <h1>Bienvenue à MYMY-IA Magique</h1>
                <p>Votre assistant IA intelligent</p>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Connexion</button>
                    <button class="tab-btn" data-tab="register">Inscription</button>
                </div>
                
                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <input type="email" id="login-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-password" placeholder="Mot de passe" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
                </form>
                
                <!-- Register Form -->
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <input type="text" id="register-username" placeholder="Nom d'utilisateur" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="register-email" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="register-password" placeholder="Mot de passe" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="register-confirm" placeholder="Confirmer le mot de passe" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
