<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYMY-IA-Magique Elite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold text-amber-400 flex items-center gap-1">
                MYMY-IA-Magique ✨
            </h1>
            <div class="flex gap-2">
                <!-- Language Selector -->
                <select id="lang-select" class="bg-slate-800 text-xs border border-slate-700 rounded p-1 text-slate-200">
                    <option value="ar">AR</option>
                    <option value="fr">FR</option>
                </select>
                <!-- Model Selector -->
                <select id="model-select" class="bg-slate-800 text-xs border border-slate-700 rounded p-1 text-slate-200 font-semibold">
                    <option value="gemini">Gemini</option>
                    <option value="claude">Claude</option>
                    <option value="grok">Grok</option>
                    <option value="ollama">Ollama (Local)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col gap-4">
        
        <div class="text-center">
            <p class="text-xs text-slate-400">منصة متعددة النماذج والذكاء الاصطناعي الخارق</p>
        </div>

        <!-- Prompt & Input Box -->
        <div class="flex flex-col gap-2">
            <label for="user-prompt" class="text-sm font-medium text-slate-300">أدخل طلبك أو الكود هنا:</label>
            <textarea id="user-prompt" rows="4" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400" placeholder="اكتب طلبك البرمجي أو الصناعي هنا..."></textarea>
        </div>

        <!-- Action Buttons (Grid Layout for Mobile) -->
        <div class="grid grid-cols-3 gap-2">
            <button id="btn-execute" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 px-3 rounded-lg text-sm shadow transition flex items-center justify-center gap-1">
                تنفيذ ⚡
            </button>
            <button id="btn-clear" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 px-3 rounded-lg text-sm border border-slate-700 transition flex items-center justify-center gap-1">
                مسح 🧹
            </button>
            <label for="file-input" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 px-3 rounded-lg text-sm border border-slate-700 transition flex items-center justify-center gap-1 cursor-pointer">
                إرفاق 📎
                <input type="file" id="file-input" class="hidden">
            </label>
        </div>

        <!-- Download HTML Button -->
        <div>
            <button id="btn-download-html" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition flex items-center justify-center gap-2">
                💾 تحميل النتيجة كملف HTML / Web
            </button>
        </div>

        <!-- Result Box -->
        <div class="flex flex-col gap-1 flex-1">
            <span class="text-xs font-semibold text-slate-400">النتيجة:</span>
            <div id="result-output" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 min-h-[150px] max-h-[250px] overflow-y-auto whitespace-pre-wrap">
                ...Le résultat s'affichera ici
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 p-3 text-center text-xs text-slate-500">
        MYMY-IA-Magique &copy; 2026 - Mobile Edition
    </footer>

    <!-- JavaScript for Functionality -->
    <script>
        // زر التنفيذ وإرسال الطلب للسيرفر
        document.getElementById('btn-execute').addEventListener('click', async () => {
            const prompt = document.getElementById('user-prompt').value;
            const model = document.getElementById('model-select').value;
            const outputDiv = document.getElementById('result-output');

            if (!prompt.trim()) {
                alert('الرجاء إدخال طلب أو نص أولاً!');
                return;
            }

            outputDiv.textContent = 'جاري المعالجة والتحليل... ⏳';

            try {
                const response = await fetch('/api/v1/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, task_type: "general", model: model })
                });

                const data = await response.json();
                if (response.ok) {
                    outputDiv.textContent = data.response;
                } else {
                    outputDiv.textContent = 'خطأ: ' + (data.detail || 'حدث خطأ غير متوقع');
                }
            } catch (err) {
                outputDiv.textContent = 'خطأ في الاتصال بالخادم: ' + err.message;
            }
        });

        // زر المسح
        document.getElementById('btn-clear').addEventListener('click', () => {
            document.getElementById('user-prompt').value = '';
            document.getElementById('result-output').textContent = '...Le résultat s'affichera ici';
        });

        // زر تحميل النتيجة كملف HTML
        document.getElementById('btn-download-html').addEventListener('click', () => {
            const content = document.getElementById('result-output').textContent;
            if (!content || content.includes('...Le résultat')) {
                alert('لا توجد نتيجة لتنزيلها حالياً!');
                return;
            }

            const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mymy-ia-result.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
    </html>
